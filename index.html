<style>
  :root{
    --peat:#1C2620; --river:#3C6E63; --river-deep:#20443E; --river-pale:#8FB3A8;
    --paper:#ECE7DA; --paper-2:#E1DACA; --white:#F8F5EE;
    --amber:#C8791F; --amber-pale:#F0DCBE; --slate:#4A5347; --line:#CDC4AF;
    --canoe:#8A5A2B;
    --g1:#D6E4DE; --g12:#B9D4C8; --g23:#E7C79A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--paper);color:var(--peat);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;
  }
  .app{display:flex;flex-direction:column;min-height:100vh}

  /* header */
  .topbar{display:flex;align-items:baseline;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--white);flex:none}
  .topbar h1{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.01em;text-transform:uppercase;font-stretch:condensed}
  .topbar .sub{font-size:.74rem;color:var(--slate);letter-spacing:.04em}
  .topbar .stats{margin-left:auto;display:flex;gap:16px;font-size:.72rem;color:var(--slate)}
  .topbar .stats b{color:var(--peat);font-weight:800}

  /* day tabs = difficulty ribbon */
  .tabs{display:flex;gap:0;padding:0 20px;background:var(--white);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
  .tab{flex:1;min-width:88px;border:none;background:transparent;padding:10px 8px 12px;cursor:pointer;text-align:center;border-bottom:3px solid transparent;transition:all .15s;position:relative}
  .tab .td{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700}
  .tab .tk{font-size:.78rem;font-weight:700;color:var(--peat);margin-top:2px;white-space:nowrap}
  .tab .tg{display:inline-block;margin-top:5px;font-size:.58rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;color:var(--river-deep)}
  .tab:hover{background:var(--paper)}
  .tab.active{border-bottom-color:var(--river)}
  .tab.active .tk{color:var(--river-deep)}

  /* main split — capped so the kit list below stays on-screen */
  .split{display:flex;height:min(62vh,560px);min-height:420px}
  #map{flex:1.6;min-width:0;background:#d7ded9}
  .panel{flex:1;max-width:440px;min-width:330px;background:#dfe4dc;border-left:1px solid #b9c2b4;overflow-y:auto;padding:24px 22px 40px}

  @media(max-width:820px){
    .split{flex-direction:column}
    #map{flex:none;height:46vh}
    .panel{max-width:none;min-width:0;border-left:none;border-top:1px solid var(--line)}
    .topbar .stats{display:none}
  }

  /* panel content */
  .p-day{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--river);font-weight:800}
  .p-route{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-.01em;margin:3px 0 4px;line-height:1.05}
  .p-meta{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--slate);margin-bottom:14px;flex-wrap:wrap}
  .p-grade{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;color:var(--river-deep)}
  .p-summary{font-size:.93rem;color:var(--peat);background:#fff;border:1px solid #c3cbbe;border-radius:12px;padding:14px 16px;margin-bottom:20px;box-shadow:0 1px 3px rgba(28,38,32,.06)}

  .seg-title{font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--river-deep);font-weight:800;margin:0 0 11px;padding-bottom:6px;border-bottom:1px solid #c3cbbe}
  .leg{display:flex;gap:11px;margin-bottom:9px;background:#fff;border:1px solid #c3cbbe;border-radius:10px;padding:11px 13px;box-shadow:0 1px 2px rgba(28,38,32,.05)}
  .leg-dot{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;margin-top:1px}
  .d-in{background:var(--river)} .d-out{background:var(--river-deep)} .d-haz{background:var(--amber)} .d-stay{background:var(--canoe)}
  .leg-body{flex:1;min-width:0}
  .leg-name{font-weight:600;font-size:.92rem}
  .leg-note{font-size:.8rem;color:var(--slate);margin-top:1px}
  .leg-dir{font-size:.74rem;color:var(--river);font-weight:700;text-decoration:none;display:inline-block;margin-top:3px}

  /* accommodation card */
  .accom{margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .accom-photo{width:100%;height:150px;object-fit:cover;display:block;background:var(--paper-2)}
  .accom-photo.ph{display:flex;align-items:center;justify-content:center;color:var(--river-pale);font-size:.8rem}
  .accom-body{padding:13px 15px}
  .accom-tag{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--canoe);font-weight:800}
  .accom-name{font-weight:700;font-size:1.02rem;margin:2px 0 4px}
  .accom-meta{font-size:.8rem;color:var(--slate);line-height:1.5}
  .accom-rating{color:var(--amber);font-weight:700}
  .accom-links{display:flex;gap:8px;margin-top:10px}
  .accom-links a{font-size:.76rem;font-weight:700;text-decoration:none;padding:7px 12px;border-radius:9px;border:1px solid var(--line);color:var(--peat);background:var(--paper)}
  .accom-links a.primary{background:var(--river);color:#fff;border-color:var(--river)}

  .shuttle{margin-top:14px;display:flex;gap:10px;background:var(--amber-pale);border-left:3px solid var(--amber);border-radius:8px;padding:11px 13px}
  .shuttle-txt{font-size:.82rem;color:#7a4f14}

  /* kit toggle strip below */
  .kit-inner{padding:0 20px 22px}
  .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .who select{font-size:.88rem;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:600}
  .who .hint{font-size:.72rem;color:var(--slate);flex-basis:100%}
  .kit-grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:720px){.kit-grid{grid-template-columns:1fr 1fr}}
  .kit-col{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kit-col h3{font-size:.84rem;text-transform:uppercase;letter-spacing:.06em;color:var(--river);margin-bottom:.2rem;display:flex;gap:8px;align-items:center}
  .badge{font-size:.56rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px}
  .badge.shared{background:var(--river);color:#fff} .badge.mine{background:var(--paper-2);color:var(--slate)}
  .kit-col .sub{font-size:.74rem;color:var(--slate);margin-bottom:.7rem}
  .chk{display:flex;align-items:flex-start;gap:8px;padding:4px 0;cursor:pointer;font-size:.86rem}
  .chk input{margin-top:3px;accent-color:var(--river);width:15px;height:15px;flex:none}
  .chk.done span.lbl{text-decoration:line-through;color:var(--river-pale)}
  .chk .by{margin-left:auto;font-size:.66rem;color:var(--river);font-weight:700;white-space:nowrap;padding-left:6px}
  .synced{font-size:.7rem;color:var(--river);margin-top:.5rem;display:flex;align-items:center;gap:6px}
  .live{width:7px;height:7px;border-radius:50%;background:var(--river);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .maperr{padding:2rem;text-align:center;color:var(--slate);font-size:.85rem}

  /* overview tab accent */
  .tab-ov.active{border-bottom-color:var(--river)}
  .tab-ov .tk{font-weight:800}

  /* crew list */
  .crew-list{display:flex;flex-direction:column;gap:9px}
  .crew-row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #c3cbbe;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(28,38,32,.07)}
  .crew-tag{font-size:.6rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;padding:4px 9px;border-radius:20px;flex:none}
  .crew-people{font-weight:700;font-size:.92rem}
  .crew-note{font-size:.76rem;color:var(--slate)}

  /* overview day rows */
  .ov-days{display:flex;flex-direction:column;gap:7px}
  .ov-day{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid #c3cbbe;border-radius:10px;padding:11px 14px;cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(28,38,32,.06)}
  .ov-day:hover{border-color:var(--river);transform:translateX(3px);box-shadow:0 2px 6px rgba(28,38,32,.12)}
  .ov-daynum{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:800;flex:none;width:44px}
  .ov-dayroute{font-weight:600;font-size:.88rem;flex:1;min-width:0}
  .ov-daymeta{font-size:.76rem;color:var(--slate);flex:none}

  /* kit bar — made prominent */
  .kitbar{flex:none;border-top:2px solid var(--river);background:var(--river-deep)}
  .kit-toggle{width:100%;text-align:left;padding:14px 20px;background:none;border:none;font-weight:800;font-size:.98rem;color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;letter-spacing:.01em}
  .kit-toggle .ksub{font-weight:500;color:var(--river-pale);font-size:.8rem}
  .kit-toggle .kbadge{background:var(--amber);color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-left:4px}
  .kit-toggle .chev{margin-left:auto;transition:transform .2s;color:#fff}
  .kit-toggle.open .chev{transform:rotate(180deg)}
  .kit-wrap{max-height:0;overflow:hidden;transition:max-height .3s;background:var(--paper)}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <h1>River Spey</h1>
    <span class="sub">Loch Insh → the Moray Firth</span>
    <div class="stats"><span><b>113.6</b> km</span><span><b>5</b> days</span><span><b>6</b> paddlers</span></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="split">
    <div id="map"><div class="maperr" id="maperr" style="display:none"></div></div>
    <div class="panel" id="panel"></div>
  </div>

  <div class="kitbar">
    <button class="kit-toggle open" id="kitToggle" onclick="toggleKit()">Kit checklist <span class="kbadge">personal + live shared</span><span class="ksub">tick your gear · group list syncs across everyone</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg></button>
    <div class="kit-wrap" id="kitWrap" style="max-height:none">
      <div class="kit-inner">
        <div class="who">
          <label for="whoami" style="font-size:.8rem;color:var(--slate);font-weight:600">Packing as:</label>
          <select id="whoami" onchange="setPaddler()">
            <option value="">— your name —</option>
            <option>Neil</option><option>James</option><option>Fraser</option><option>Dagmar</option><option>Michael</option><option>Rory</option>
          </select>
          <span class="hint">Personal list saves to you. Group list is shared live with everyone on the link.</span>
        </div>
        <div class="kit-grid" id="kit"></div>
      </div>
    </div>
  </div>

</div>

<script>
// ---------------- DATA ----------------
const DAYS = [
  {n:1, route:"Loch Insh → Aviemore", km:"11.3 km", grade:"Gd 1", gc:"g1",
   summary:"Easy opener on the upper Spey. Loch/river wind and trees on the bends are the only things to watch.",
   putin:{lat:57.1261482,lng:-3.9248624,name:"Put-in · near Loch Insh",note:"Launch into the upper Spey just below the loch."},
   takeout:{lat:57.1837957,lng:-3.8299229,name:"Take-out · Aviemore",note:"Exit at the Old Bridge Bunkhouse. Also Day 2 put-in."},
   accom:{lat:57.1838545,lng:-3.830408,name:"Old Bridge Bunkhouse",query:"Old Bridge Bunkhouse Aviemore",tag:"Night 1 · 4-bunk room"}},
  {n:2, route:"Aviemore → Grantown", km:"24.6 km", grade:"Gd 1/2", gc:"g12",
   summary:"Pace picks up. Gravel rapids and braided channels — pick the main flow and mind sweepers. Fraser & Dagmar join here.",
   putin:{lat:57.1837957,lng:-3.8299229,name:"Put-in · Aviemore",note:"Relaunch from the bunkhouse."},
   takeout:{lat:57.3196585,lng:-3.6137972,name:"Take-out · Grantown (Old Spey Bridge)",note:"Exit SE of town by the old bridge."},
   accom:{lat:57.3295808,lng:-3.6099836,name:"Ben Mhor Hotel",query:"Ben Mhor Hotel Grantown-on-Spey",tag:"Night 2 · Grantown"}},
  {n:3, route:"Grantown → Aberlour", km:"41.4 km", grade:"Gd 2/3", gc:"g23",
   summary:"The big one — long day plus the trip's only grade 3 at Knockando. Solid moving-water skills, early start.",
   putin:{lat:57.3196585,lng:-3.6137972,name:"Put-in · Grantown",note:"Early start — 41km ahead."},
   hazard:{lat:57.4103,lng:-3.3706,name:"Knockando rapids · Grade 3",note:"Hardest water of the trip. Inspect on arrival; portage available. Immersion kit on."},
   takeout:{lat:57.4693257,lng:-3.2333641,name:"Take-out · Aberlour",note:"Exit at Aberlour, ~5km road to the bed. Also Day 4 put-in."},
   accom:{lat:57.4898031,lng:-3.1889117,name:"Highlander Inn, Craigellachie",query:"Highlander Inn Craigellachie",tag:"Night 3 · whisky stop, meal booked"},
   shuttle:"Leave a vehicle at the Aberlour take-out — the bed is ~5km on and you relaunch from Aberlour on Day 4."},
  {n:4, route:"Aberlour → Fochabers", km:"26.3 km", grade:"Gd 1/2", gc:"g12",
   summary:"Fast and powerful rather than technical. Pushy wave trains at Boat o' Brig when the river's up.",
   putin:{lat:57.4693257,lng:-3.2333641,name:"Put-in · Aberlour",note:"Shuttle back from Craigellachie."},
   hazard:{lat:57.5509736,lng:-3.1417779,name:"Boat o' Brig · wave trains",note:"Fast, powerful water — pushy when high. Canoes bail as needed."},
   takeout:{lat:57.6147007,lng:-3.1050492,name:"Take-out · Fochabers",note:"Exit near Fochabers, west bank below the bridge. Also Day 5 put-in."},
   accom:{lat:57.6149444,lng:-3.0995265,name:"Gordon Arms Hotel, Fochabers",query:"Gordon Arms Hotel Fochabers",tag:"Night 4 · Fochabers"}},
  {n:5, route:"Fochabers → Spey Bay", km:"10.0 km", grade:"Gd 1", gc:"g1",
   summary:"Short final leg. River braids near the mouth — wrong channel means dragging over shingle. Exposed, windy finish.",
   putin:{lat:57.6147007,lng:-3.1050492,name:"Put-in · Fochabers",note:"Relaunch for the short run to the sea."},
   takeout:{lat:57.675044,lng:-3.1081787,name:"Finish · Spey Bay (Garmouth/Kingston side)",note:"Journey's end on the west bank — not the Dolphin Centre across the estuary."}}
];

const KIT = {
  personal:{title:"Personal",badge:"mine",badgeText:"Yours",sub:"Each paddler packs their own",
    items:["Helmet","Buff + skullcap","Shorty wetsuit","4/3 wetsuit","Thermal base layers","Paddling cag","Buoyancy aid (PFD)","River knife on PFD","Paddling gloves","Wetsuit boots + neoprene socks","Sunglasses + lanyard","Sunscreen + SPF lip balm","Whistle","Waterproof water bottle","Phone case","Head torch + spare batteries","Power bank + cable","Dry bag + mini drybags","Full dry change (sealed)","Midge repellent + head net","Personal first-aid / meds","Toilet paper","Spraydeck (kayakers)"]},
  group:{title:"Group",badge:"shared",badgeText:"Shared live",sub:"Tick shows for everyone, with who sorted it",
    items:["First aid kit (group)","Spare split paddle","Throwlines — 1 per paddler","Sling + 2 screwgates","Spare line","Bailer + sponges","Boat pump","Duct / Gorilla tape","Epoxy putty (holed hull)","Cable ties","Group bothy shelter","Waterproof map","Axe (camp only)"]}
};

// ---------------- TABS ----------------
const CREW=[
  {boat:"Kayak",kind:"kayak",people:"Neil & James",note:"crossover kayaks"},
  {boat:"Canoe",kind:"canoe",people:"Fraser & Dagmar",note:"Canadian canoe"},
  {boat:"Canoe",kind:"canoe",people:"Michael & Rory",note:"Canadian canoe"}
];
const tabsEl=document.getElementById('tabs');
// Overview tab first
const ov=document.createElement('button');
ov.className='tab tab-ov'; ov.id='tab-0';
ov.onclick=()=>selectOverview();
ov.innerHTML=`<div class="td">Trip</div><div class="tk">Overview</div><span class="tg" style="background:var(--river);color:#fff">ALL</span>`;
tabsEl.appendChild(ov);
DAYS.forEach(d=>{
  const b=document.createElement('button');
  b.className='tab'; b.id='tab-'+d.n;
  b.onclick=()=>selectDay(d.n);
  const gcol = d.gc==='g1'?'var(--g1)':d.gc==='g12'?'var(--g12)':'var(--g23)';
  b.innerHTML=`<div class="td">Day ${d.n}</div><div class="tk">${d.route.split(' → ')[0]}→${d.route.split(' → ')[1].slice(0,4)}</div><span class="tg" style="background:${gcol}">${d.grade}</span>`;
  tabsEl.appendChild(b);
});

// ---------------- PANEL ----------------
function renderOverview(){
  const crewRows=CREW.map(c=>{
    const col=c.kind==='kayak'?'var(--river)':'var(--canoe)';
    return `<div class="crew-row"><span class="crew-tag" style="background:${col}">${c.boat}</span><div class="crew-body"><div class="crew-people">${c.people}</div><div class="crew-note">${c.note}</div></div></div>`;
  }).join('');
  const dayRows=DAYS.map(d=>{
    const gcol=d.gc==='g1'?'var(--g1)':d.gc==='g12'?'var(--g12)':'var(--g23)';
    return `<button class="ov-day" onclick="selectDay(${d.n})"><span class="ov-daynum">Day ${d.n}</span><span class="ov-dayroute">${d.route}</span><span class="ov-daymeta">${d.km}</span><span class="p-grade" style="background:${gcol}">${d.grade}</span></button>`;
  }).join('');
  document.getElementById('panel').innerHTML=`
    <div class="p-day">The trip</div>
    <div class="p-route">Loch Insh → Spey Bay</div>
    <div class="p-meta"><span>113.6 km</span><span>5 days</span><span>Grade 1 → 3 → 1</span></div>
    <div class="p-summary">A five-day descent from the Cairngorms to the Moray Firth, building from easy grade 1 water to the grade 3 crux at Knockando on Day 3, then easing back to the sea. Tap a day to see its leg on the map.</div>
    <div class="seg-title">Crew · 6 paddlers, 3 boats</div>
    <div class="crew-list">${crewRows}</div>
    <div class="seg-title" style="margin-top:20px">Days</div>
    <div class="ov-days">${dayRows}</div>`;
}
function renderPanel(d){
  const legs=[];
  legs.push(legRow('in',d.putin));
  if(d.hazard) legs.push(legRow('haz',d.hazard));
  legs.push(legRow('out',d.takeout));
  const gcol = d.gc==='g1'?'var(--g1)':d.gc==='g12'?'var(--g12)':'var(--g23)';
  let accom='';
  if(d.accom){
    accom=`<div class="accom" id="accomCard">
      <div class="accom-photo ph" id="accomPhoto">Loading photo…</div>
      <div class="accom-body">
        <div class="accom-tag">${d.accom.tag}</div>
        <div class="accom-name">${d.accom.name}</div>
        <div class="accom-meta" id="accomMeta">Loading details…</div>
        <div class="accom-links">
          <a class="primary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.accom.query)}" target="_blank" rel="noopener">Open in Maps</a>
        </div>
      </div></div>`;
  }
  const shuttle=d.shuttle?`<div class="shuttle"><div class="leg-dot d-haz">⇄</div><div class="shuttle-txt">${d.shuttle}</div></div>`:'';
  document.getElementById('panel').innerHTML=`
    <div class="p-day">Day ${d.n}</div>
    <div class="p-route">${d.route}</div>
    <div class="p-meta"><span class="p-grade" style="background:${gcol}">${d.grade}</span><span>${d.km}</span></div>
    <div class="p-summary">${d.summary}</div>
    <div class="seg-title">On the water</div>
    ${legs.join('')}
    ${shuttle}
    ${accom}`;
  if(d.accom) loadAccom(d.accom);
}
function legRow(type,pt){
  const cls=type==='in'?'d-in':type==='out'?'d-out':'d-haz';
  const glyph=type==='in'?'▼':type==='out'?'▲':'!';
  const dir=`https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lng}`;
  return `<div class="leg"><div class="leg-dot ${cls}">${glyph}</div><div class="leg-body"><div class="leg-name">${pt.name}</div><div class="leg-note">${pt.note}</div><a class="leg-dir" href="${dir}" target="_blank" rel="noopener">Directions →</a></div></div>`;
}

// ---------------- MAP ----------------
let gmap,gDirSvc,gPlaces,gInfo;
let dayMarkers=[],dayRoutes=[];
window.initMap=async function(){
  const {Map}=await google.maps.importLibrary("maps");
  await google.maps.importLibrary("routes");
  await google.maps.importLibrary("places");
  gmap=new Map(document.getElementById('map'),{mapTypeId:'terrain',mapTypeControl:true,streetViewControl:false,fullscreenControl:true,gestureHandling:'greedy'});
  gDirSvc=new google.maps.DirectionsService();
  gPlaces=new google.maps.places.PlacesService(gmap);
  gInfo=new google.maps.InfoWindow();
  window._ready=true;
  selectOverview();
};

function clearMap(){
  dayMarkers.forEach(m=>m.setMap(null)); dayMarkers=[];
  dayRoutes.forEach(r=>r.setMap(null)); dayRoutes=[];
}
function marker(pt,type,label){
  const col=type==='in'?'#3C6E63':type==='out'?'#20443E':type==='haz'?'#C8791F':'#8A5A2B';
  const glyph=type==='in'?'P':type==='out'?'T':type==='haz'?'!':'H';
  // SVG teardrop pin with letter
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">
    <path d="M15 0C6.7 0 0 6.7 0 15c0 10 15 25 15 25s15-15 15-25C30 6.7 23.3 0 15 0z" fill="${col}" stroke="#F8F5EE" stroke-width="2"/>
    <circle cx="15" cy="15" r="8" fill="#F8F5EE"/>
    <text x="15" y="19.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="${col}">${glyph}</text>
  </svg>`;
  const m=new google.maps.Marker({position:{lat:pt.lat,lng:pt.lng},map:gmap,title:pt.name,
    icon:{url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),
      scaledSize:new google.maps.Size(type==='haz'?34:30,type==='haz'?45:40),
      anchor:new google.maps.Point((type==='haz'?34:30)/2,type==='haz'?45:40)},
    zIndex:type==='haz'?100:type==='stay'?50:80});
  const dir=`https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lng}`;
  m.addListener('click',()=>{gInfo.setContent(`<div style="font-size:.85rem;font-family:-apple-system,sans-serif"><b>${pt.name}</b><br><a href="${dir}" target="_blank" rel="noopener" style="color:#3C6E63;font-weight:700">Directions →</a></div>`);gInfo.open(gmap,m);});
  dayMarkers.push(m); return m;
}
function roadRoute(a,b,color,weight,dashed){
  gDirSvc.route({origin:{lat:a.lat,lng:a.lng},destination:{lat:b.lat,lng:b.lng},travelMode:'DRIVING'},(res,st)=>{
    if(st==='OK'){
      const path=res.routes[0].overview_path;
      if(!dashed){
        // casing (soft halo) under the main line for depth
        dayRoutes.push(new google.maps.Polyline({path,map:gmap,strokeColor:'#F8F5EE',strokeOpacity:.9,strokeWeight:weight+4,zIndex:1}));
        dayRoutes.push(new google.maps.Polyline({path,map:gmap,strokeColor:color,strokeOpacity:.95,strokeWeight:weight,zIndex:2}));
      } else {
        dayRoutes.push(new google.maps.Polyline({path,map:gmap,strokeColor:color,strokeOpacity:0,strokeWeight:weight,zIndex:2,
          icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:.8,strokeColor:color,scale:2},offset:'0',repeat:'12px'}]}));
      }
    }
  });
}

function selectOverview(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-0').classList.add('active');
  renderOverview();
  if(!window._ready) return;
  clearMap();
  const b=new google.maps.LatLngBounds();
  // markers for every put-in/take-out, hazard, and accommodation across all days
  const seen=new Set();
  DAYS.forEach(d=>{
    const addPt=(pt,type,lab)=>{const k=pt.lat+','+pt.lng+type;if(seen.has(k))return;seen.add(k);marker(pt,type,lab);b.extend({lat:pt.lat,lng:pt.lng});};
    addPt(d.putin,'in','');
    if(d.hazard) addPt(d.hazard,'haz','!');
    addPt(d.takeout,'out','');
    if(d.accom) addPt(d.accom,'stay','H');
    // paddling road proxy for each leg, thin; amber on grade-3 day
    const lc = d.gc==='g23' ? '#C8791F' : '#3C6E63';
    roadRoute(d.putin, d.hazard||d.takeout, lc, 4, false);
    if(d.hazard) roadRoute(d.hazard, d.takeout, lc, 4, false);
    if(d.accom) roadRoute(d.takeout, d.accom, '#8A5A2B', 3, true);
  });
  gmap.fitBounds(b,{top:50,bottom:50,left:50,right:50});
}

function selectDay(n){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
  const d=DAYS.find(x=>x.n===n);
  renderPanel(d);
  if(!window._ready) return;
  clearMap();
  const pts=[d.putin]; if(d.hazard)pts.push(d.hazard); pts.push(d.takeout);
  // markers
  marker(d.putin,'in','P'); if(d.hazard)marker(d.hazard,'haz','!'); marker(d.takeout,'out','T');
  if(d.accom) marker(d.accom,'stay','H');
  // paddling road route (put-in -> [hazard] -> take-out) as the leg line; amber on the grade-3 day
  const legCol = d.gc==='g23' ? '#C8791F' : '#3C6E63';
  roadRoute(d.putin, d.hazard||d.takeout, legCol, 5, false);
  if(d.hazard) roadRoute(d.hazard, d.takeout, legCol, 5, false);
  // accommodation road route, dashed brown
  if(d.accom) roadRoute(d.takeout, d.accom, '#8A5A2B', 4, true);
  // frame the leg
  const b=new google.maps.LatLngBounds();
  pts.forEach(p=>b.extend({lat:p.lat,lng:p.lng}));
  if(d.accom) b.extend({lat:d.accom.lat,lng:d.accom.lng});
  gmap.fitBounds(b,{top:60,bottom:60,left:60,right:60});
}

// accommodation Places enrichment
function loadAccom(a){
  if(!window._ready||!gPlaces) return;
  gPlaces.findPlaceFromQuery({query:a.query,fields:['place_id']},(r,st)=>{
    if(st==='OK'&&r&&r[0]){
      gPlaces.getDetails({placeId:r[0].place_id,fields:['formatted_address','rating','user_ratings_total','photos','formatted_phone_number','website']},(d,st2)=>{
        if(st2!=='OK'||!d) return;
        const photoEl=document.getElementById('accomPhoto');
        if(photoEl){
          if(d.photos&&d.photos[0]){const url=d.photos[0].getUrl({maxWidth:420,maxHeight:200});photoEl.outerHTML=`<img class="accom-photo" src="${url}" alt="${a.name}">`;}
          else{photoEl.textContent='No photo';}
        }
        const meta=document.getElementById('accomMeta');
        if(meta){
          const rating=d.rating?`<span class="accom-rating">★ ${d.rating}</span> (${d.user_ratings_total||0})<br>`:'';
          const addr=d.formatted_address?`${d.formatted_address}<br>`:'';
          const tel=d.formatted_phone_number?`${d.formatted_phone_number}`:'';
          meta.innerHTML=`${rating}${addr}${tel}`;
        }
        const links=document.querySelector('#accomCard .accom-links');
        if(links){
          if(d.formatted_phone_number) links.insertAdjacentHTML('beforeend',`<a href="tel:${d.formatted_phone_number.replace(/\\s/g,'')}">Call</a>`);
          if(d.website) links.insertAdjacentHTML('beforeend',`<a href="${d.website}" target="_blank" rel="noopener">Website</a>`);
        }
      });
    } else {
      const meta=document.getElementById('accomMeta'); if(meta) meta.textContent='';
      const photoEl=document.getElementById('accomPhoto'); if(photoEl) photoEl.textContent='';
    }
  });
}

function loadGoogleMaps(){
  if(!GOOGLE_MAPS_KEY||GOOGLE_MAPS_KEY.indexOf('PASTE')===0){
    const e=document.getElementById('maperr'); e.style.display='block';
    e.textContent='Add your Google Maps key in the setup block at the top of this file.';
    selectOverview(); return;
  }
  const s=document.createElement('script');
  s.src=`https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_KEY}&callback=initMap&loading=async&libraries=places,routes`;
  s.async=true;
  s.onerror=()=>{const e=document.getElementById('maperr');e.style.display='block';e.textContent='Map failed to load — check the key restrictions.';};
  document.head.appendChild(s);
}

// ---------------- KIT (Firebase shared + personal) ----------------
let paddler="",personalState={},groupState={},db=null;
function toggleKit(){
  const w=document.getElementById('kitWrap'),t=document.getElementById('kitToggle');
  const open=t.classList.toggle('open');
  if(open){ w.style.maxHeight=w.scrollHeight+'px'; setTimeout(()=>{if(t.classList.contains('open'))w.style.maxHeight='none';},320); }
  else { w.style.maxHeight=w.scrollHeight+'px'; requestAnimationFrame(()=>{w.style.maxHeight='0';}); }
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getDatabase, ref, onValue, set as dbSet, remove as dbRemove } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

let db=null, groupState={}, paddler="", personalState={};
try{
  if(firebaseConfig.apiKey.indexOf('PASTE')!==0){
    const app=initializeApp(firebaseConfig);
    db=getDatabase(app);
    onValue(ref(db,'group'), s=>{ groupState=s.val()||{}; renderKit(); }, ()=>{});
  }
}catch(e){ console.error('firebase',e); }

window.setPaddler=function(){
  paddler=document.getElementById('whoami').value;
  try{personalState=JSON.parse(localStorage.getItem('spey:p:'+paddler)||'{}');}catch(e){personalState={};}
  renderKit();
};
window.flipPersonal=function(i,box){
  if(!paddler){alert('Pick your name first.');box.checked=!box.checked;return;}
  personalState['p'+i]=box.checked;
  try{localStorage.setItem('spey:p:'+paddler,JSON.stringify(personalState));}catch(e){}
  renderKit();
};
window.flipGroup=async function(i,box){
  const who=paddler||'someone';
  try{
    if(box.checked) await dbSet(ref(db,'group/g'+i),{done:true,by:who});
    else await dbRemove(ref(db,'group/g'+i));
  }catch(e){ alert('Could not reach the shared list.'); box.checked=!box.checked; }
};
window.renderKit=function(){
  const kitEl=document.getElementById('kit'); if(!kitEl) return;
  kitEl.innerHTML='';
  const P=KIT.personal;
  const pr=P.items.map((it,i)=>{const done=personalState['p'+i];return `<label class="chk ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="flipPersonal(${i},this)"><span class="lbl">${it}</span></label>`;}).join('');
  const pd=document.createElement('div');pd.className='kit-col';
  pd.innerHTML=`<h3>${P.title} <span class="badge mine">${P.badgeText}</span></h3><div class="sub">${P.sub}${paddler?' · <b>'+paddler+'</b>':''}</div>${pr}`;
  kitEl.appendChild(pd);
  const G=KIT.group;
  const gr=G.items.map((it,i)=>{const st=groupState['g'+i];const by=st&&st.done?`<span class="by">✓ ${st.by}</span>`:'';return `<label class="chk ${st&&st.done?'done':''}"><input type="checkbox" ${st&&st.done?'checked':''} onchange="flipGroup(${i},this)"><span class="lbl">${it}</span>${by}</label>`;}).join('');
  const gd=document.createElement('div');gd.className='kit-col';
  gd.innerHTML=`<h3>${G.title} <span class="badge shared">${G.badgeText}</span></h3><div class="sub">${G.sub}</div>${gr}<div class="synced"><span class="live"></span> Live across everyone on the link</div>`;
  kitEl.appendChild(gd);
};
renderKit();
</script>

<script>loadGoogleMaps();</script>
